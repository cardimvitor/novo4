name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    environment: agents
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check board
        run: bash .github/scripts/agent-board.sh check "$ISSUE"
      - name: Register start on board
        run: bash .github/scripts/agent-board.sh start claude "$ISSUE"
      - name: Run Claude Code using subscription OAuth
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record PR on board
        if: always()
        run: bash .github/scripts/agent-board.sh claude-finish "$ISSUE"
